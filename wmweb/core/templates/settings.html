{% extends 'profile.html' %}
{% block title%}Настройки{% endblock %}

{% load static %}
{% block pages_body %}
<div class="container py-5 container-fluid" style="background-color: whitesmoke; width: 700px; border-radius: 10px;">
  <h3 class="text-center">Настройки</h3>
  <br>
  <div class="modal-footer">
    <form class="w-75" method="post" action="save_settings">
      {% csrf_token %}
      <span class="badge text-bg-secondary text-uppercase w-75"><small for="timeout" class="form-label">
        <strong>Время отправки qr-code после создания заявки (Секунды!)</strong></small></span>
      <div class="input-group mb-3 w-75">
        <input id="timeout" type="text" class="form-control" name="timeout" value="{{timeout}}" disabled>
      </div>
      <div class="btn-group w-75">
        <button type="button" class="btn btn-primary" name="save_account" onclick="enable_edit_settings()">Изменить</button>
        &nbsp;
        <button type="submit" class="btn btn-primary">Сохранить</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
