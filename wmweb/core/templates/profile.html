{% extends 'base.html' %}
{% block title%}Profile{% endblock %}

{% load static %}
{% block body %}
<!-- Modal windows -->
<!-- Add account (modal) -->
<div id="addNewProfile" class="modal" tabindex="-1" role="dialog">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title">Новый профиль</h4>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" onclick="$('#addNewProfile').modal('hide');"></button>
      </div>
      <form method="post" enctype="multipart/form-data" action="save_profile">
        {% csrf_token %}
        <div class="upload-container">
          <div class="border-container">
            <div class="icons fa-4x">
              <i class="fas fa-file-image" data-fa-transform="shrink-3 down-2 left-6 rotate--45"></i>
              <i class="fas fa-file-alt" data-fa-transform="shrink-2 up-4"></i>
              <i class="fas fa-file-pdf" data-fa-transform="shrink-3 down-2 right-6 rotate-45"></i>
            </div>
            <div class="d-flex justify-content-center">
              <p><input id="file" type="file" name="user_pic"/><p>
            </div>
          </div>
        </div>
        <br>
        <div class="input-group mb-3">
          <input type="text" class="form-control" name="name" placeholder="ФИО">
        </div>
        <div class="input-group mb-3">
          <select class="form-select" name="city" aria-label="Города">
            <option selected disabled>Выберите город</option>
            <option value="Алматы">Алматы</option>
            <option value="Нур-Султан">Нур-Султан</option>
            <option value="Шымкент">Шымкент</option>
            <option value="Актобе">Актобе</option>
            <option value="Караганда">Караганда</option>
            <option value="Атырау">Атырау</option>
            <option value="Тараз">Тараз</option>
            <option value="Павлодар">Павлодар</option>
            <option value="Семей">Семей</option>
            <option value="Усть-Каменогорск">Усть-Каменогорск</option>
            <option value="Кызылорда">Кызылорда</option>
          </select>
        </div>
        <div class="input-group mb-3">
          <div class="input-group-prepend"><span class="input-group-text"><i class="bi bi-whatsapp"></i></span></div>
          <input type="text" class="form-control" name="wa_phone" placeholder="Введите номер телефона (WhatsApp)">
        </div>
        <small>Номер телефона вводить без символов</small>
        <div class="modal-footer">
          {% csrf_token %}
          <button type="submit" class="btn btn-primary" name="save_account">Сохранить</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="container-fluid">
  <div class="row flex-nowrap">
      <div class="col-auto col-md-3 col-xl-2 px-sm-2 px-0 bg-dark">
          <div class="d-flex flex-column align-items-center align-items-sm-start px-3 pt-2 text-white min-vh-100">
              <a href="/" class="d-flex align-items-center pb-3 mb-md-0 me-md-auto text-white text-decoration-none">
                  <span class="fs-5 d-none d-sm-inline">Woman Motivia</span>
              </a>
              <ul class="nav nav-pills flex-column mb-sm-auto mb-0 align-items-center align-items-sm-start" id="menu">
                  <li class="nav-item">
                      <a href="/" class="nav-link align-middle px-0">
                          <i class="fs-4 bi-house"></i> <span class="ms-1 d-none d-sm-inline">Home</span>
                      </a>
                  </li>
                  <li>
                      <a href="/surgeons" class="nav-link px-0 align-middle">
                          <i class="fs-4 bi-people"></i> <span class="ms-1 d-none d-sm-inline">Хирурги</span> </a>
                  </li>
                  <li>
                    <a href="/deals" class="nav-link px-0 align-middle">
                        <i class="fs-4 bi-table"></i> <span class="ms-1 d-none d-sm-inline">Orders</span></a>
                </li>
              </ul>
              <hr>
              <!--<div class="dropdown pb-4">
                  <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" id="dropdownUser1" data-bs-toggle="dropdown" aria-expanded="false">
                      <img src="https://github.com/mdo.png" alt="hugenerd" width="30" height="30" class="rounded-circle">
                      <span class="d-none d-sm-inline mx-1">loser</span>
                  </a>
                  <ul class="dropdown-menu dropdown-menu-dark text-small shadow">
                      <li><a class="dropdown-item" href="#">New project...</a></li>
                      <li><a class="dropdown-item" href="#">Settings</a></li>
                      <li><a class="dropdown-item" href="#">Profile</a></li>
                      <li>
                          <hr class="dropdown-divider">
                      </li>
                      <li><a class="dropdown-item" href="#">Sign out</a></li>
                  </ul>
              </div>-->
          </div>
      </div>
      <div class="col py-3">
        {% block pages_body %}{% endblock %}
      </div>
  </div>
</div>
{% endblock %}
