{% extends 'base.html' %}
{% block title%}Главная страница{% endblock %}

{% load static %}
{% block body %}
<div class="container-fluid">
  <div class="row flex-nowrap">
      <div class="col-auto col-md-3 col-xl-2 px-sm-2 px-0 bg-dark">
          <div class="d-flex flex-column align-items-center align-items-sm-start px-3 pt-2 text-white min-vh-100">
              <a href="/" class="d-flex align-items-center pb-3 mb-md-0 me-md-auto text-white text-decoration-none">
                  <span class="fs-5 d-none d-sm-inline">Motiva Kazakhstan</span>
              </a>
              <ul class="nav nav-pills flex-column mb-sm-auto mb-0 align-items-center align-items-sm-start" id="menu">
                  <li class="nav-item">
                      <a href="/" class="nav-link align-middle px-0">
                          <i class="fs-4 bi-house"></i> <span class="ms-1 d-none d-sm-inline">Главная страница</span>
                      </a>
                  </li>
                  <li>
                      <a href="/surgeons" class="nav-link px-0 align-middle">
                          <i class="fs-4 bi-people"></i> <span class="ms-1 d-none d-sm-inline">Хирурги</span> </a>
                  </li>
                  <li>
                    <a href="/deals" class="nav-link px-0 align-middle">
                        <i class="fs-4 bi-table"></i> <span class="ms-1 d-none d-sm-inline">Заявки</span></a>
                  </li>
                  <li>
                    <a href="/cities" class="nav-link px-0 align-middle">
                      <i class="fs-4 bi-map"></i></i> <span class="ms-1 d-none d-sm-inline">Города</span></a>
                  </li>
                  <li>
                    <a href="/questions" class="nav-link px-0 align-middle">
                      <i class="fs-4 bi-list"></i></i> <span class="ms-1 d-none d-sm-inline">Вопросы</span></a>
                  </li>
              </ul>
              <hr>
              <div class="dropdown pb-4">
                <button class="btn btn-outline-secondary dropdown-toggle" type="button" id="dropdownMenuButton" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                    <span class="d-none d-sm-inline mx-1">Top User</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-dark text-small shadow" aria-labelledby="dropdownMenuButton">
                    <li><a class="dropdown-item" href="settings">Настройки</a></li>
                </ul>
              </div>
          </div>
      </div>
      <div class="col py-3">
        {% block pages_body %}{% endblock %}
      </div>
  </div>
</div>
{% endblock %}
