{% extends 'profile.html' %}
{% block title%}Заявки{% endblock %}

{% load static %}
{% block pages_body %}
<!-- Add question (modal) -->
<div id="AddQuestion" class="modal" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h4 class="modal-title">Добавить вопрос</h4>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" onclick="$('#AddQuestion').modal('hide');"></button>
        </div>
        <form method="post" enctype="multipart/form-data" action="save_question">
          {% csrf_token %}
          <p>
            <div class="input-group">
              <textarea class="form-control" name="question" placeholder="Вопрос"></textarea>
            </div>
          </p>
          <div class="input-group">
            <textarea class="form-control" name="answer" placeholder="Ответ"></textarea>
          </div>
          <div class="modal-footer">
            {% csrf_token %}
            <button type="submit" class="btn btn-primary" name="save_question">Сохранить</button>
          </div>
        </form>
      </div>
    </div>
  </div>

<div id="questions-container" class="container py-5 container-fluid">
  <p>
    <div class="hstack gap-3">
      <div>
        <h4>Вопросы</h4>
      </div>
      <div>
        <button type="button" class="btn btn-secondary" onclick="$('#AddQuestion').modal('show');"><i class="bi bi-bookmark-plus"></i></button>
      </div>
    </div>
  </p>
  <div class="scrollable-table-wrapper">
    <table class="table">
      <thead>
        <tr>
          <th scope="col">Вопрос</th>
          <th scope="col">Ответ</th>
          <th scope="col">Действие</th>
        </tr>
      </thead>
      <tbody>
        {% for question in questions %}
          <tr>
            <td>{{question.question}}</td>
            <td>{{question.answer}}</td>
            <td><button id="{{question.pk}}" type="button" class="btn btn-outline-danger" onclick="delete_question(this.id)">Удалить</button></td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
